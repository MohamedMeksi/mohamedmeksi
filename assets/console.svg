<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-label="Agent console status panel, live status and task log for Mohamed Meksi">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #388bfd; stroke-opacity: 0.5; stroke-width: 1; }
      .title { font: 700 20px 'Fira Code', 'Cascadia Code', monospace; fill: #58a6ff; letter-spacing: 1px; }
      .status { font: 600 13px 'Fira Code', 'Cascadia Code', monospace; fill: #3fb950; }
      .connecting { font: 600 13px 'Fira Code', 'Cascadia Code', monospace; fill: #d29922; }
      .label { font: 400 13px 'Fira Code', 'Cascadia Code', monospace; fill: #8b949e; }
      .value { font: 600 13px 'Fira Code', 'Cascadia Code', monospace; fill: #e6edf3; }
      .log { font: 400 12px 'Fira Code', 'Cascadia Code', monospace; fill: #79c0ff; }
      .dim { font: 400 11px 'Fira Code', 'Cascadia Code', monospace; fill: #6e7681; }
      .cursor { fill: #79c0ff; }
    </style>
  </defs>

  <rect class="bg" width="820" height="380" rx="10"/>
  <rect width="820" height="380" rx="10" fill="url(#bgGlow)"/>
  <rect class="panel" x="12" y="12" width="796" height="356" rx="8">
    <animate attributeName="stroke-opacity" values="0.25;0.6;0.25" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="34" cy="34" r="5" fill="#ff5f56"/>
  <circle cx="52" cy="34" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="34" r="5" fill="#27c93f"/>
  <text x="90" y="39" class="dim">agent://mohamed-meksi/console</text>

  <text x="40" y="84" class="title" filter="url(#softGlow)" opacity="0">
    AGENT: MEK
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.5s" fill="freeze"/>
  </text>

  <text x="240" y="84" class="connecting">
    ◌ CONNECTING...
    <animate attributeName="opacity" from="1" to="0" begin="0.1s" dur="0.7s" fill="freeze"/>
  </text>
  <text x="240" y="84" class="status" opacity="0">
    ● STATUS: ONLINE
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
  </text>

  <text x="470" y="84" class="dim">OPERATOR: Mohamed Meksi</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>

    <text x="40" y="118" class="label">MISSION:</text>
    <text x="130" y="118" class="value">WhatsApp &amp; AI agent automation · full-stack e-commerce &amp; field-ops</text>

    <line x1="40" y1="136" x2="780" y2="136" stroke="#30363d" stroke-width="1"/>

    <text x="40" y="164" class="label">repos_shipped</text>
    <text x="190" y="164" class="value">28</text>

    <text x="280" y="164" class="label">stars_earned</text>
    <text x="430" y="164" class="value">38</text>

    <text x="510" y="164" class="label">contributions_1y</text>
    <text x="660" y="164" class="value">n/a</text>

    <text x="40" y="192" class="label">last_public_push</text>
    <text x="190" y="192" class="value">0h ago</text>

    <line x1="40" y1="210" x2="780" y2="210" stroke="#30363d" stroke-width="1"/>

    <text x="40" y="220" class="label">$ tail -f task_queue.log</text>
  </g>

  <text x="40" y="236" class="log" opacity="0">[TASK] mohamedmeksi last synced · 0h ago<animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.25s" fill="freeze"/></text><text x="40" y="259" class="log" opacity="0">[TASK] ai-job-search last synced · 10d ago<animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.25s" fill="freeze"/></text><text x="40" y="282" class="log" opacity="0">[TASK] Backpack-3-Flask-Clean-Architecture last synced · 38d ago<animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.25s" fill="freeze"/></text><text x="40" y="305" class="log" opacity="0">[TASK] Backpack-2-Node-Express-Architecture last synced · 58d ago<animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.25s" fill="freeze"/></text>

  <rect class="cursor" x="40" y="318" width="8" height="13" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.15s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="2.6s" repeatCount="indefinite"/>
  </rect>
</svg>